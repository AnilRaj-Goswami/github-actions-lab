```yaml
name: Sync Secret to OpenBao

on:
  workflow_dispatch:
    inputs:
      secrets_name:
        description: "Secret key name to create or update in OpenBao"
        type: string
        required: true
      secrets_value:
        description: "Secret value"
        type: string
        required: true

permissions:
  contents: read

jobs:
  sync-secret:
    name: Store Secret in OpenBao
    runs-on: [self-hosted, docker_host]

    steps:
      - name: Validate configuration
        shell: bash
        env:
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          SECRET_NAME: ${{ inputs.secrets_name }}
          SECRET_VALUE: ${{ inputs.secrets_value }}
        run: |
          set -euo pipefail

          [[ -n "$OPENBAO_ADDR" ]] || {
            echo "OPENBAO_ADDR is missing"
            exit 1
          }

          [[ -n "$OPENBAO_TOKEN" ]] || {
            echo "OPENBAO_TOKEN is missing"
            exit 1
          }

          [[ -n "$SECRET_NAME" ]] || {
            echo "Secret name is required"
            exit 1
          }

          [[ -n "$SECRET_VALUE" ]] || {
            echo "Secret value is required"
            exit 1
          }

          # Validate key name to prevent unexpected input
          [[ "$SECRET_NAME" =~ ^[A-Za-z0-9_.-]+$ ]] || {
            echo "Invalid secret name. Use letters, numbers, underscore, dot or hyphen."
            exit 1
          }

          echo "Configuration validation successful."

      - name: Write secret to OpenBao
        shell: bash
        env:
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
          OPENBAO_TOKEN: ${{ secrets.OPENBAO_TOKEN }}
          OPENBAO_NAMESPACE: lab
          OPENBAO_MOUNT: kv
          OPENBAO_PATH: github-actions/demo
          SECRET_NAME: ${{ inputs.secrets_name }}
          SECRET_VALUE: ${{ inputs.secrets_value }}
          PAYLOAD_FILE: ${{ runner.temp }}/openbao-payload.json

        run: |
          set -euo pipefail
          umask 077

          trap 'rm -f "$PAYLOAD_FILE"' EXIT

          python3 -c '
          import json, os

          payload = {
              "data": {
                  os.environ["SECRET_NAME"]: os.environ["SECRET_VALUE"]
              }
          }

          with open(os.environ["PAYLOAD_FILE"], "w") as f:
              json.dump(payload, f)
          '

          echo "Updating OpenBao secret..."

          curl --fail --silent --show-error \
            --request PATCH \
            --header "X-Vault-Token: $OPENBAO_TOKEN" \
            --header "X-Vault-Namespace: $OPENBAO_NAMESPACE" \
            --header "Content-Type: application/merge-patch+json" \
            --data-binary "@$PAYLOAD_FILE" \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            "${OPENBAO_ADDR}/v1/${OPENBAO_MOUNT}/data/${OPENBAO_PATH}"

          echo "Secret successfully stored in OpenBao."
```
