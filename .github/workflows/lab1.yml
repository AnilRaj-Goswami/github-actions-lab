name: "GitHub Actions Lab 3"

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      app-version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate application version
        id: version
        run: |
          APP_VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: $APP_VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Display version from build job
        run: |
          echo "Deploying version: ${{ needs.build.outputs.app-version }}"
